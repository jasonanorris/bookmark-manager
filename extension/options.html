<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options-shell">
      <header>
        <p class="eyebrow">Bookmark Manager</p>
        <h1>Settings</h1>
      </header>

      <form id="settings-form" class="settings-form">
        <label for="api-url">API URL</label>
        <input
          id="api-url"
          name="apiUrl"
          type="text"
          inputmode="url"
          autocapitalize="none"
          autocomplete="url"
          placeholder="https://bookmarks.radarapp.us"
          required
        />

        <label for="api-token">API Password</label>
        <input
          id="api-token"
          name="apiToken"
          type="password"
          autocomplete="current-password"
          required
        />

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button type="submit">Save Settings</button>
        </div>
      </form>
    </main>
    <script type="module" src="dist/options.js"></script>
  </body>
</html>
